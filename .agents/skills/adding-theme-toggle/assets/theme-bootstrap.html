<!--
  Drop this <script> block in <head>, immediately after <title> and BEFORE the
  stylesheet. It runs synchronously before paint, preventing flash-of-wrong-theme.

  Reads localStorage first, falls back to system preference.
-->
<script>
  (function() {
    try {
      var stored = localStorage.getItem('theme');
      var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = theme;
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  })();
</script>

<!-- Optional: also tell the browser chrome to match -->
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#fafbfc" media="(prefers-color-scheme: light)" />

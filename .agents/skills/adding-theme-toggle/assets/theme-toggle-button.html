<!--
  Drop the button into your nav/header.
  The CSS hides moon in dark mode, hides sun in light mode — automatic via [data-theme="light"].
-->

<style>
  .theme-toggle {
    background: var(--soft-1); border: 1px solid var(--border);
    color: var(--muted); width: 34px; height: 34px;
    border-radius: 8px; display: inline-grid; place-items: center;
    cursor: pointer; padding: 0;
    transition: background-color .15s, color .15s, border-color .15s;
  }
  .theme-toggle:hover { background: var(--soft-2); color: var(--text); border-color: var(--border-2); }
  .theme-toggle svg { width: 16px; height: 16px; display: block; }
  .theme-toggle .icon-moon { display: none; }
  [data-theme="light"] .theme-toggle .icon-sun { display: none; }
  [data-theme="light"] .theme-toggle .icon-moon { display: block; }
</style>

<button class="theme-toggle" id="theme-toggle" type="button"
        aria-label="Toggle dark/light theme" title="Toggle theme">
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2"/><path d="M12 20v2"/>
    <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
    <path d="M2 12h2"/><path d="M20 12h2"/>
    <path d="m4.93 19.07 1.41-1.41"/><path d="m17.66 6.34 1.41-1.41"/>
  </svg>
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
</button>

<!-- Place this <script> right before </body> -->
<script>
  (function() {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    btn.addEventListener('click', function() {
      var current = document.documentElement.dataset.theme || 'dark';
      var next = current === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
    var mq = window.matchMedia('(prefers-color-scheme: light)');
    if (mq.addEventListener) {
      mq.addEventListener('change', function(e) {
        if (!localStorage.getItem('theme')) {
          document.documentElement.dataset.theme = e.matches ? 'light' : 'dark';
        }
      });
    }
  })();
</script>
